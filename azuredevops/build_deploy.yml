# Azure DevOps equivalent of .github/workflows/app.yml + the deploy step.
# Requires: an Azure Resource Manager service connection using
# workload identity federation (no secret), and pipeline variables
# serviceConnection and webAppName.
trigger:
  branches:
    include: [main]
  paths:
    include: [src, pom.xml]

stages:
  - stage: Build
    jobs:
      - job: Maven
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: JavaToolInstaller@0
            inputs:
              versionSpec: "17"
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled
          - script: ./mvnw -B verify
            displayName: Build and test
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFiles: "**/surefire-reports/TEST-*.xml"
          - publish: target/app.jar
            artifact: app

  - stage: Deploy
    dependsOn: Build
    jobs:
      - deployment: WebApp
        # Approvals and checks are configured on this Azure DevOps environment.
        environment: dev
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  inputs:
                    azureSubscription: $(serviceConnection)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: $(Pipeline.Workspace)/app/app.jar
