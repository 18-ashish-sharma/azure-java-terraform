spring.application.name=demo

# App Service (Java SE on Linux) provides PORT; default to 8080 locally.
server.port=${PORT:8080}

# Expose only what the platform needs. Never expose '*' in production.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=demo

# Datasource comes from environment variables set by Terraform (app_settings).
# DB_PASSWORD is a Key Vault reference resolved by App Service at runtime.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:demo}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:}
# Start even if the DB is not reachable yet; health will report it as DOWN.
spring.sql.init.mode=never
spring.datasource.hikari.initialization-fail-timeout=-1
