name: app

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "pom.xml", ".mvn/**", "mvnw", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["src/**", "pom.xml", ".mvn/**", "mvnw", ".github/workflows/app.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/app.jar
          retention-days: 7
